<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>9月の工事確認</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#F5F4F0; --paper:#FFFFFF; --ink:#1E2321; --muted:#6A6F6B; --line:#DCDAD3; --line2:#EEECE6;
  --accent:#0E6E6B; --accent-ink:#FFFFFF;
  --ok:#2E7D32; --ok-bg:#E8F3E9; --ng:#C62828; --ng-bg:#FBE9E9; --part:#B26A00; --part-bg:#FFF3E0;
  --warn:#9A4A00; --warn-bg:#FFF4E5; --warn-line:#F2C48C;
  --shadow:0 1px 0 rgba(30,35,33,.06), 0 8px 24px -16px rgba(30,35,33,.25);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151816; --paper:#1D211F; --ink:#ECEBE6; --muted:#9BA09B; --line:#2E3431; --line2:#262B28;
  --accent:#4FB3AF; --accent-ink:#0F1A19;
  --ok:#7CC57F; --ok-bg:#1C2E1E; --ng:#F07171; --ng-bg:#3A2020; --part:#F0B35A; --part-bg:#3A2D18;
  --warn:#F0B35A; --warn-bg:#33281A; --warn-line:#5A4526;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#151816; --paper:#1D211F; --ink:#ECEBE6; --muted:#9BA09B; --line:#2E3431; --line2:#262B28;
  --accent:#4FB3AF; --accent-ink:#0F1A19;
  --ok:#7CC57F; --ok-bg:#1C2E1E; --ng:#F07171; --ng-bg:#3A2020; --part:#F0B35A; --part-bg:#3A2D18;
  --warn:#F0B35A; --warn-bg:#33281A; --warn-line:#5A4526;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,.num{font-family:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{font-size:22px;font-weight:900;margin:2px 0 8px;letter-spacing:.01em;text-wrap:balance}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{font-weight:400;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.chip:focus-visible,.seg button:focus-visible,.send:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.hint{margin:14px 0 6px;font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;box-shadow:var(--shadow);position:relative}
.card.warn{border-color:var(--warn-line)}
.card.warn::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--warn)}
.card.answered{border-color:var(--line2)}
.card h2{font-size:17px;font-weight:700;margin:0 0 2px;line-height:1.35;text-wrap:balance}
.koji{font-size:14px;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px;color:var(--muted)}
.meta .num{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.items{margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.items li::before{content:"·";margin-right:6px}
.evidence{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);background:transparent}
.tag.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn);font-weight:700}
.tag.ok{color:var(--ok);border-color:transparent;background:var(--ok-bg)}
.why{margin-top:8px;font-size:13px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:8px 10px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.seg button{font-family:inherit;font-size:15px;font-weight:700;padding:11px 4px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation}
.seg button[data-v="done"][aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[data-v="not"][aria-pressed="true"]{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.seg button[data-v="amt"][aria-pressed="true"]{background:var(--part-bg);border-color:var(--part);color:var(--part)}
.ask{margin-top:12px;font-size:14px;font-weight:700}
.price{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.price .big{font-family:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.price .tax{font-size:12px;color:var(--muted)}
.fix{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px;border-radius:9px;background:var(--part-bg);border:1px solid var(--part)}
.fix label{font-size:13px;font-weight:700;color:var(--part);white-space:nowrap}
.fix input{flex:1;min-width:0;font-family:inherit;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);text-align:right}
.fix input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fix .diff{font-size:12px;color:var(--muted);white-space:nowrap}
textarea{width:100%;margin-top:8px;font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:38px}
textarea::placeholder{color:var(--muted)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .st{flex:1;font-size:13px;color:var(--muted)}
.send{font-family:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.send[disabled]{opacity:.5;cursor:default}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
.lock{max-width:420px;margin:12vh auto 0;padding:0 18px;text-align:center}
.lock h1{font-size:20px;margin-bottom:6px}
.lock p{color:var(--muted);font-size:14px;margin:0 0 16px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;font-family:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.lock input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lock .err{color:var(--ng);font-size:13px;min-height:1.4em;margin-top:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.bar i,.toast{transition:none}}
</style>

<div class="lock" id="lock">
  <div class="eyebrow">ビルドクラスタ · 月初の確認</div>
  <h1>9月の工事確認</h1>
  <p>社内で共有したパスワードを入れてください</p>
  <form id="lockf"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" autofocus><button class="send" type="submit">開く</button></form>
  <div class="err" id="lockerr"></div>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="eyebrow">ビルドクラスタ · 月初の確認</div>
    <h1 id="ttl">9月にやった工事、これで合っていますか</h1>
    <div class="chips" id="chips" role="group" aria-label="担当者"></div>
    <div class="progress"><div class="bar"><i id="bar"></i></div><span id="prog">0 / 0</span></div>
  </header>

  <div class="list" id="list"></div>
  <p class="note">※「波及で完了」＝アプリが兄弟パターンにあわせて自動で完了にした案件です。本人が完了にしていない可能性があるので必ず確認してください。<br>※写真の枚数はフォルダから自動で数えた目安です。</p>
</div>

let DATA = null, GAS = '', TOKEN = '';
const KEY = 'mc_2026-09';
const params = new URLSearchParams(location.search);
let who = params.get('who') || '';
let ans = {};
try { ans = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { ans = {}; }

const yen = n => '¥' + Number(n||0).toLocaleString('ja-JP');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function jobsFor(){ return who ? DATA.jobs.filter(j => j.tantou === who) : DATA.jobs; }

function renderChips(){
  const el = document.getElementById('chips');
  const counts = {};
  DATA.jobs.forEach(j => counts[j.tantou] = (counts[j.tantou]||0) + 1);
  const names = DATA.tantou;
  el.innerHTML = [`<button class="chip" aria-pressed="${who===''}" data-who="">全員<span class="n">${DATA.jobs.length}</span></button>`]
    .concat(names.map(n => `<button class="chip" aria-pressed="${who===n}" data-who="${esc(n)}">${esc(n.replace(/\s+/g,''))}<span class="n">${counts[n]||0}</span></button>`)).join('');
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { who = b.dataset.who; render(); window.scrollTo({top:0}); }));
}

function reasons(j){
  const r = [];
  if (j.propagated) r.push('波及で完了');
  if (j.siblingDoneCount > 1) r.push(`同じ案件のパターン${j.siblingDoneCount}件が完了`);
  if (j.photos === 0) r.push('写真なし');
  else if (j.photoFolderMatch < 4) r.push('この工事の写真が見当たらない');
  return r;
}

function renderList(){
  const list = document.getElementById('list');
  const js = jobsFor();
  if (!js.length){ list.innerHTML = '<div class="empty">この担当の9月完了案件はありません</div>'; return; }
  list.innerHTML = js.map(j => {
    const a = ans[j.id] || {};
    const rs = reasons(j);
    const warn = j.propagated || j.siblingDoneCount > 1 || j.photos === 0 || j.photoFolderMatch < 4;
    const photo = j.photos === 0 ? '<span class="tag warn">写真 0枚</span>'
      : (j.photoFolderMatch >= 4 ? `<span class="tag ok">写真 ${j.photos}枚</span>` : `<span class="tag warn">写真 ${j.photos}枚（別の工事のものかも）</span>`);
    return `<article class="card${warn?' warn':''}${a.v?' answered':''}" data-id="${esc(j.id)}">
      <h2>${esc(j.bukken)} ${esc(j.room)}</h2>
      <div class="koji">${esc(j.koji)}${j.patternLabel?` <span class="tag">${esc(j.patternLabel)}</span>`:''}</div>
      <div class="meta"><span>${esc(j.motouke)}</span><span>完了 ${esc(j.completeDate)}</span>${who?'':`<span>担当 ${esc(j.tantou)}</span>`}</div>
      <div class="price"><span class="big">${yen(j.total)}</span><span class="tax">税抜・台帳の金額</span></div>
      ${j.items.length?`<ul class="items">${j.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
      <div class="evidence">${photo}${j.propagated?'<span class="tag warn">波及で完了</span>':''}${j.siblingDoneCount>1?`<span class="tag warn">パターン${j.siblingDoneCount}件が完了</span>`:''}</div>
      ${rs.length?`<div class="why">確認してほしい点：${rs.join('・')}</div>`:''}
      <div class="ask">この金額で請求していいですか？</div>
      <div class="seg" role="group" aria-label="回答">
        <button data-v="done" aria-pressed="${a.v==='done'}">この金額でOK</button>
        <button data-v="amt" aria-pressed="${a.v==='amt'||a.v==='part'}">金額がちがう</button>
        <button data-v="not" aria-pressed="${a.v==='not'}">やってない</button>
      </div>
      ${(a.v==='amt'||a.v==='part')?`<div class="fix"><label for="amt-${esc(j.id)}">正しい金額（税抜）</label><input id="amt-${esc(j.id)}" class="amt" inputmode="numeric" placeholder="例 45000" value="${a.amt!=null?esc(a.amt):''}"><span class="diff">${a.amt!=null&&a.amt!==''?(Number(a.amt)-Number(j.total||0)>=0?'+':'')+yen(Number(a.amt)-Number(j.total||0)).replace('¥-','-¥'):''}</span></div>`:''}
      <textarea rows="1" placeholder="ひとこと（例：便器交換はやっていない／追加でクロス1面）">${esc(a.c||'')}</textarea>
    </article>`;
  }).join('');
  list.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    const id = b.closest('.card').dataset.id;
    ans[id] = Object.assign({}, ans[id], {v: b.dataset.v, at: new Date().toISOString(), who: who || null});
    save(); render();
    if (b.dataset.v === 'amt'){ const el = document.getElementById('amt-' + id); if (el) el.focus(); }
  }));
  list.querySelectorAll('input.amt').forEach(t => {
    t.addEventListener('input', () => {
      const id = t.closest('.card').dataset.id;
      const v = t.value.normalize('NFKC').replace(/[^0-9]/g, '');
      ans[id] = Object.assign({}, ans[id], {amt: v === '' ? null : Number(v)});
      save(); renderFoot();
    });
    t.addEventListener('change', () => renderList());
  });
  list.querySelectorAll('textarea').forEach(t => t.addEventListener('input', () => {
    const id = t.closest('.card').dataset.id;
    ans[id] = Object.assign({}, ans[id], {c: t.value});
    save(); renderFoot();
  }));
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch(e){} }

function renderFoot(){
  const js = jobsFor();
  const n = js.filter(j => ans[j.id] && ans[j.id].v).length;
  const nn = js.filter(j => ans[j.id] && ans[j.id].v === 'not').length;
  const np = js.filter(j => ans[j.id] && (ans[j.id].v === 'amt' || ans[j.id].v === 'part')).length;
  const nmiss = js.filter(j => ans[j.id] && ans[j.id].v === 'amt' && (ans[j.id].amt == null)).length;
  document.getElementById('prog').textContent = `${n} / ${js.length}`;
  document.getElementById('bar').style.width = js.length ? (100*n/js.length)+'%' : '0%';
  const st = document.getElementById('st');
  st.textContent = n ? `${n}件回答（金額ちがう${np}・やってない${nn}）` + (nmiss ? `　⚠正しい金額が未入力${nmiss}件` : '') + (GAS ? '' : '　※試作：この端末に保存') : 'まだ回答がありません';
  document.getElementById('send').disabled = !n || nmiss > 0;
}

function render(){ renderChips(); renderList(); renderFoot(); }

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1800); }

document.getElementById('send').addEventListener('click', async () => {
  const payload = {month: DATA.month, who: who || null, answers: ans, sentAt: new Date().toISOString()};
  if (!GAS || !TOKEN){ toast('保存しました（試作：この端末のみ）'); return; }
  try {
    // 本番: 見積GASの save-shared-config に 担当ごとのキーで保存（上書き）。読み口は夜間巡回と佳織さんの集計。
    const key = `monthly_confirm_${DATA.month}_${(who||'all').replace(/\s+/g,'')}`;
    const r = await fetch(GAS, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'save-shared-config', token: TOKEN, key, value: JSON.stringify(payload)})});
    const j = await r.json();
    toast(j && j.ok ? '送信しました。ありがとうございます' : '送信できませんでした。山田まで連絡してください');
  } catch(e){ toast('送信できませんでした。電波の良いところで再度お試しください'); }
});

async function unlock(pw){
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, key, b(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById('lockf').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('lockerr'); err.textContent = '';
  try {
    const p = await unlock(document.getElementById('pw').value);
    DATA = p.data; GAS = p.gas || ''; TOKEN = p.token || '';
    try { sessionStorage.setItem(KEY + '_pw', document.getElementById('pw').value); } catch(e){}
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false; document.getElementById('foot').hidden = false;
    render();
  } catch(e) { err.textContent = 'パスワードが違います'; }
});
(async () => {   // 同じタブで開き直した時だけ自動で開く
  let pw = ''; try { pw = sessionStorage.getItem(KEY + '_pw') || ''; } catch(e){}
  if (!pw) return;
  try { const p = await unlock(pw); DATA = p.data; GAS = p.gas || ''; TOKEN = p.token || '';
    document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false; document.getElementById('foot').hidden = false; render(); } catch(e){}
})();
</script>
