<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在庫管理はカレンダーへ移りました</title>
<!-- 📦 在庫アプリ単体(/zaiko/)を畳み、カレンダーの📦在庫管理タブへ案内する1枚(設計書 §6⓵)。
     元のアプリは ./index_legacy.html に残してある=このファイルを戻せば元どおり。
     同じ場所(buildcluster-glitch.github.io)なので、在庫の手元データ(zaiko_v1)はカレンダーがそのまま使う。
     カレンダーは「前回開いていた画面」を覚えているので、そこを📦在庫管理にしてから移る。 -->
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;background:#f8fafc;color:#0f172a;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;box-sizing:border-box}
  @media (prefers-color-scheme:dark){ body{background:#0f172a;color:#e2e8f0} .card{background:#1e293b!important;border-color:#334155!important} }
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px 22px;max-width:420px;width:100%;text-align:center}
  h1{font-size:18px;margin:0 0 10px}
  p{font-size:14px;line-height:1.7;margin:0 0 16px}
  a.btn{display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:700}
  small{display:block;margin-top:14px;color:#64748b}
</style>
</head>
<body>
<div class="card">
  <h1>📦 在庫管理はカレンダーに移りました</h1>
  <p>このまま自動でカレンダーの「📦在庫管理」を開きます。<br>入力した在庫の記録はそのまま引き継がれます。</p>
  <a class="btn" id="go" href="/build-cluster-app/">カレンダーの在庫管理を開く</a>
  <small>ホーム画面のアイコンはこのままで大丈夫です</small>
</div>
<script>
  try{ localStorage.setItem('buildcluster_schedule_last_view', 'inventory'); }catch(_){}
  setTimeout(function(){ location.replace('/build-cluster-app/'); }, 1200);
</script>
</body>
</html>
