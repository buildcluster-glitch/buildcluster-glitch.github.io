<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>単価表(モバイル) - ビルドクラスタ</title>
<style>
  :root{ --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --accent:#7c3aed; --text:#0f172a; --muted:#64748b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  header{ position:sticky; top:0; z-index:10; background:var(--accent); color:#fff; padding:10px 12px; display:flex; align-items:center; gap:8px; }
  header h1{ font-size:16px; margin:0; flex:1; }
  header button{ background:rgba(255,255,255,.2); border:none; color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; }
  .toolbar{ position:sticky; top:44px; z-index:9; background:var(--bg); padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); }
  #search{ flex:1; min-width:140px; font-size:16px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; }
  #moto{ font-size:14px; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; max-width:48%; }
  .meta{ font-size:11px; color:var(--muted); padding:4px 12px; }
  main{ padding:8px 10px 40px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .card-head{ display:flex; align-items:center; gap:10px; padding:11px 12px; cursor:pointer; }
  .card-head .nm{ flex:1; min-width:0; }
  .card-head .item{ font-weight:600; font-size:15px; line-height:1.3; }
  .card-head .cat{ font-size:11px; color:var(--muted); }
  .card-head .price{ font-size:18px; font-weight:700; color:#7c2d12; white-space:nowrap; text-align:right; }
  .card-head .price small{ font-size:10px; color:var(--muted); font-weight:normal; display:block; }
  .detail{ display:none; padding:6px 12px 12px; border-top:1px dashed var(--line); background:#fafafa; }
  .detail.open{ display:block; }
  .prow{ display:flex; justify-content:space-between; padding:4px 0; font-size:14px; border-bottom:1px solid #f1f5f9; }
  .prow b{ font-variant-numeric:tabular-nums; }
  .sec{ font-size:11px; color:var(--accent); font-weight:700; margin:8px 0 2px; }
  .kyaku{ background:#fffbeb; }
  .hatchu{ background:#eff6ff; }
  .empty{ text-align:center; color:var(--muted); padding:40px 12px; }
  /* カテゴリ絞り込みチップ */
  .cats{ display:flex; gap:6px; overflow-x:auto; padding:6px 10px 8px; background:var(--bg); -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--line); }
  .cats::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; font-size:13px; padding:7px 13px; border:1px solid var(--line); border-radius:18px; background:#fff; color:#334155; white-space:nowrap; }
  .chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .chip .n{ opacity:.6; font-size:11px; margin-left:3px; }
  /* カテゴリ見出し */
  .gh{ font-size:12px; font-weight:700; color:var(--accent); padding:10px 4px 4px; position:sticky; top:92px; background:var(--bg); z-index:5; }
  /* 設定 */
  #settings{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; align-items:flex-start; justify-content:center; padding:20px; }
  #settings.open{ display:flex; }
  .setbox{ background:#fff; border-radius:12px; width:100%; max-width:420px; padding:16px; }
  .setbox h2{ font-size:16px; margin:0 0 10px; }
  .setbox label{ font-size:12px; color:var(--muted); display:block; margin:8px 0 3px; }
  .setbox input{ width:100%; font-size:15px; padding:9px; border:1px solid var(--line); border-radius:8px; }
  .setbox .btns{ display:flex; gap:8px; margin-top:14px; }
  .setbox button{ flex:1; font-size:15px; padding:11px; border-radius:8px; border:none; }
  .setbox .save{ background:var(--accent); color:#fff; font-weight:600; }
  .setbox .cancel{ background:#e2e8f0; color:#334155; }
  .setbox .hint{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }
  /* ===== ✏編集(段3・2026-09-21) ===== */
  .card-head .edit{margin-left:6px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer;color:#7c3aed}
  .card-head .edit:active{background:#f1f5f9}
  #edit{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #edit.open{display:block}
  .edbox{background:#fff;margin:0 auto;max-width:640px;min-height:100%;padding:14px 14px 90px}
  .edhead{position:sticky;top:0;background:#fff;padding:10px 0;border-bottom:1px solid #e2e8f0;z-index:2}
  .edhead h2{margin:0;font-size:16px}
  .edhead .sub{color:#64748b;font-size:12px;margin-top:2px}
  .edsec{margin:16px 0 6px;font-size:12px;font-weight:700;color:#475569;border-left:3px solid #7c3aed;padding-left:6px}
  .edrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9}
  .edrow label{flex:1;font-size:13px;color:#334155;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .edrow input{width:118px;flex:none;padding:7px 8px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;text-align:right}
  .edrow input.txt{width:190px;text-align:left}
  .edrow input.ch{border-color:#7c3aed;background:#faf5ff}
  .edrow .was{font-size:11px;color:#94a3b8;width:64px;flex:none;text-align:right}
  .edfoot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 14px;display:flex;gap:8px;max-width:640px;margin:0 auto}
  .edfoot button{flex:1;padding:12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-size:15px}
  .edfoot .save{background:#7c3aed;color:#fff;border-color:#7c3aed;font-weight:700}
  .edfoot button:disabled{opacity:.5}
  .ednote{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:12px;color:#92400e;margin:8px 0;line-height:1.6}
  .ederr{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;font-size:13px;color:#b91c1c;margin:8px 0;line-height:1.6;white-space:pre-wrap}
  .hist{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12px}
  .hist b{font-size:13px}
  .hist .hb{margin-top:6px;padding:5px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>📋 単価表</h1>
  <button id="btn-reload">🔄 更新</button>
  <button id="btn-settings">⚙</button>
</header>
<div class="toolbar">
  <input id="search" type="search" placeholder="🔍 工事名・カテゴリで検索" autocomplete="off">
  <select id="moto"></select>
</div>
<div class="cats" id="cats"></div>
<div class="meta" id="meta"></div>
<main id="list"><div class="empty">⚙設定でGAS URL・トークンを入れて「更新」を押してください</div></main>


<div id="edit"><div class="edbox">
  <div class="edhead">
    <h2 id="ed-title">単価を直す</h2>
    <div class="sub" id="ed-sub"></div>
  </div>
  <div id="ed-body"></div>
  <div class="edfoot">
    <button id="ed-cancel">閉じる</button>
    <button id="ed-hist">📜 履歴</button>
    <button id="ed-save" class="save">保存</button>
  </div>
</div></div>

<div id="settings">
  <div class="setbox">
    <h2>⚙ 接続設定</h2>
    <label>master_sync GAS URL (.../exec)</label>
    <input id="set-url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>トークン</label>
    <input id="set-token" placeholder="共有トークン">
    <div class="btns">
      <button class="cancel" id="set-cancel">キャンセル</button>
      <button class="save" id="set-save">保存して取得</button>
    </div>
    <div class="hint">PCの自社工事管理アプリ → 設定 の「master_sync」のURL・トークンと同じ値を入れてください（一度入れれば保存されます）。<br>※単価はPC側「単価マスタ → 📱スマホ単価表へ共有」で更新されます。</div>
  </div>
</div>

<script>
const LS = { url:'tanka_gas_url', token:'tanka_gas_token', moto:'tanka_moto' };
let DATA = null; // {updatedAt, motoCols, items}
let curCat = ''; // 選択中カテゴリ('' = すべて)
const $ = s => document.querySelector(s);
// 🔴2026-09-21: **0は「値が無い」ではなく「0という値」**。migration046でDBが0を保つようになるので、
//   ここで落とすと「0円で出す運用の単価」が画面から消える(処分系は先週も¥0で請求している)。
//   ⇒ 未設定(null/undefined/空文字)だけ '—'。**0は ¥0 と出す**。
const fmt = n => (n === null || n === undefined || n === '') ? '—' : '¥'+Number(n).toLocaleString();

function openSettings(){
  $('#set-url').value = localStorage.getItem(LS.url)||'';
  $('#set-token').value = localStorage.getItem(LS.token)||'';
  $('#settings').classList.add('open');
}
function closeSettings(){ $('#settings').classList.remove('open'); }
$('#btn-settings').onclick = openSettings;
$('#set-cancel').onclick = closeSettings;
$('#set-save').onclick = () => {
  localStorage.setItem(LS.url, $('#set-url').value.trim());
  localStorage.setItem(LS.token, $('#set-token').value.trim());
  closeSettings(); load();
};

// 💾 前回取得した単価をこの端末に保存し、次回は「即表示→裏で更新」(2026-08-04 山田「読み込みクソ重い」対応)
//   GASは混雑発作中どのキーも40〜75秒かかることが実測で判明。単価は頻繁に変わらないので
//   キャッシュ表示が実質正解。裏の更新が成功したら静かに差し替え、失敗してもキャッシュ表示は残す。
const CACHE_KEY = 'tanka_cache_v1';
function loadCache(){ try{ const o=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); return (o&&o.data)?o:null; }catch(_){ return null; } }
function saveCache(data){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data, at:new Date().toISOString()})); }catch(_){} }
function applyData(data){ DATA = data; buildMotoSelect(); buildCats(); render(); }
function noteRefresh(msg){ const el=$('#meta'); if(el && msg) el.textContent = (el.textContent||'') + ' ／ ' + msg; }

// 🧪 DB移行 先行パイロット第1号(2026-08-06・社長GO)= Supabaseから直読みする。
//   キーは公開前提の読み取り専用anon。これで台帳/カレンダーは401=露出はtanka_publicのみ(台帳DBセッション検証済)。
//   中身は毎朝5:30の影同期でGASのprice_masterを丸ごと写したもの=形は完全に同じ。
//   ⚠ここが転んでも②現行GAS→③キャッシュに落ちるので、スタッフには何も起きない。
const SB = {
  url: 'https://grbqpsunbuduvvgdntzc.supabase.co/rest/v1/tanka_public?select=doc&id=eq.1',
  key: 'sb_publishable__CEhKynIR-v9uGW_cBg_1g_wHyN-k8n',
  timeout: 6000
};
// 🆕 段1(2026-09-13): 品目1行の `tanka_items` から直読みする。**段0(migration026)が入るまでは 404 → 従来経路**なので、
//   このまま公開しておけば**入った瞬間に自動で切り替わる**(配布の段取りが要らない)。
//   狙い= いまの `tanka_public` は朝便の日次コピー=**当日の変更が翌朝反映**。行を直読みすれば**即時**になる。
//   ⚠安全側の作り(3つ): ①表が無い/0件 → 従来経路 ②**件数が手元の8割未満なら信用しない**(段0の流し込み途中を掴まない)
//     ③行が読めた時は **GAS追いかけをしない**(行が正本なので、古い price_master で上書きしてはいけない)
//   認証= ログイン済みなら `bc_sb_session` のJWT、無ければ anon。どちらも駄目なら従来経路へ。
const SB_ROWS = {
  base: 'https://grbqpsunbuduvvgdntzc.supabase.co/rest/v1/',
  timeout: 6000,
  page: 1000,
};
function sbRowsAuth_(){
  try{
    const o = JSON.parse(localStorage.getItem('bc_sb_session')||'null');
    if(o && o.access_token) return o.access_token;
  }catch(_){}
  return SB.key;   // 未ログインでも anon で読めるならそれで(読み権限はDB側の設定次第)
}
async function fetchRowsFromDb_(){
  const tok = sbRowsAuth_();
  const hdr = { apikey: SB.key, Authorization: 'Bearer ' + tok, Accept: 'application/json' };
  const ac = new AbortController();
  const to = setTimeout(()=>ac.abort(), SB_ROWS.timeout);
  try{
    // 列(元請け/業者)
    const rc = await fetch(SB_ROWS.base + 'tanka_cols?select=kind,name,sort&order=sort.asc', { headers: hdr, signal: ac.signal });
    if(rc.status === 404 || rc.status === 400) return null;          // 表がまだ無い=段0前
    if(!rc.ok) throw new Error('cols HTTP ' + rc.status);
    const cols = await rc.json();
    if(!Array.isArray(cols)) throw new Error('cols 形が違う');
    // 品目(1000件ずつ・総件数と受信数の一致を必ず確かめる)
    const sel = 'item_no,cat,item,unit,prices,hatchu,tenant,owner,material,part_no,updated_at,actor,version';   // version=編集の楽観ロックに要る(段3)
    const all = []; let from = 0, total = null;
    for(;;){
      const r = await fetch(SB_ROWS.base + 'tanka_items?select=' + sel + '&is_deleted=eq.false&order=item_no.asc',
        { headers: Object.assign({ Range: from + '-' + (from + SB_ROWS.page - 1), 'Range-Unit':'items', Prefer:'count=exact' }, hdr), signal: ac.signal });
      if(r.status === 404 || r.status === 400) return null;
      if(!(r.status === 200 || r.status === 206)) throw new Error('items HTTP ' + r.status);
      const rows = await r.json();
      if(!Array.isArray(rows)) throw new Error('items 形が違う');
      all.push(...rows);
      const cr = r.headers.get('content-range') || '';
      const m = cr.match(/\/(\d+|\*)\s*$/); if(m && m[1] !== '*') total = parseInt(m[1], 10);
      if(rows.length < SB_ROWS.page || (total != null && all.length >= total)) break;
      from += SB_ROWS.page;
    }
    if(total != null && all.length !== total) throw new Error('件数が合わない ' + all.length + '/' + total);
    if(!all.length) return null;                                     // 0件=流し込み前
    // ②流し込み途中を掴まない: 手元(表示中/キャッシュ)の8割を下回るなら信用しない
    const known = (DATA && Array.isArray(DATA.items) && DATA.items.length) ? DATA.items.length
                : ((loadCache()||{}).data && (loadCache().data.items||[]).length) || 0;
    if(known && all.length < known * 0.8) throw new Error('件数が少なすぎる ' + all.length + '/' + known);
    // 従来と同じ doc の形に組み直す(表示側は無改修で通る)
    let newest = '';
    const items = all.map(r=>{
      if(r.updated_at && String(r.updated_at) > newest) newest = String(r.updated_at);
      return { no:r.item_no, cat:r.cat||'', item:r.item||'', unit:r.unit||'',
               prices:r.prices||{}, hatchu:r.hatchu||{},
               tenant:r.tenant, owner:r.owner, material:r.material, partNo:r.part_no||'',
               _updatedAt:r.updated_at||'', _actor:r.actor||'', _version:r.version };
    });
    const pick = k => cols.filter(c=>c.kind===k).map(c=>c.name);
    return { updatedAt: newest || new Date().toISOString(),
             motoCols: pick('moto'), hatchuCols: pick('hatchu'), items, _rows:true };
  } finally { clearTimeout(to); }
}
async function fetchFromDb_(){
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), SB.timeout);
  try{
    const r = await fetch(SB.url, { headers:{ apikey:SB.key, Authorization:'Bearer '+SB.key }, signal:ac.signal });
    if(!r.ok) throw new Error('DB HTTP '+r.status);
    const arr = await r.json();
    let doc = (Array.isArray(arr) && arr[0]) ? arr[0].doc : null;
    if(typeof doc === 'string'){ doc = JSON.parse(doc); }   // JSONB/テキストどちらでも読めるように
    if(!doc || !Array.isArray(doc.items) || !doc.items.length) throw new Error('DB応答が空');
    return doc;
  } finally { clearTimeout(to); }
}
// 現行GAS(master_sync)から取得。HTML応答/404スパイク対策の3回リトライ(2026-08-03)
//   戻り値: データ / null(=共有がまだ一度も押されていない)。全滅時はthrow。
async function fetchFromGas_(url, token, onRetry){
  let lastErr = null;
  for(let att = 0; att < 3; att++){
    try{
      const r = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'get-shared-config', key:'price_master', token }) });
      const t = await r.text();
      let d;
      try{ d = JSON.parse(t); }catch(_){ throw new Error('サーバー混雑(HTML応答)。自動で再試行します'); }
      if(!d.ok) throw new Error(d.error||'failed');
      if(!d.value) return null;
      return JSON.parse(d.value);
    }catch(e){
      lastErr = e;
      if(att < 2){
        if(onRetry) onRetry(att);
        await new Promise(res => setTimeout(res, 2500*(att+1)));
      }
    }
  }
  throw lastErr || new Error('failed');
}
function isNewerThanShown_(cand){
  const a = String((DATA && DATA.updatedAt) || ''), b = String((cand && cand.updatedAt) || '');
  if(!b) return false;
  const tA = Date.parse(a), tB = Date.parse(b);
  return (!isNaN(tA) && !isNaN(tB)) ? (tB > tA) : (b > a);
}
// DBは毎朝5:30更新=「PCで📱共有を押した当日ぶん」はまだ入っていない。表示は待たせずDBで出しておき、
// 裏で現行GASに聞いて新しければ静かに差し替える(取れなくても黙って諦める=表示はDBぶんで足りている)。
async function chaseGasInBackground_(url, token){
  try{
    const g = await fetchFromGas_(url, token, null);
    if(g && isNewerThanShown_(g)){ saveCache(g); applyData(g); noteRefresh('📱共有ぶんを反映'); }
  }catch(_){ /* 表示は済んでいるので何も出さない */ }
}

async function load(){
  const url = (localStorage.getItem(LS.url)||'').trim();
  const token = (localStorage.getItem(LS.token)||'').trim();
  const hasGas = !!(url && token);   // DBはURL/トークン不要=未設定端末でも単価は見られる(⚙は最後の手段に降格)
  // ① まず前回の内容を即表示(あれば)
  const cached = loadCache();
  let showedCache = false;
  if(cached){
    try{ applyData(cached.data); showedCache = true;
      const d = new Date(cached.at);
      noteRefresh(`最新を確認中…(表示は${isNaN(d)?'前回':`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}取得分)`);
    }catch(_){ showedCache = false; }
  }
  if(!showedCache) $('#list').innerHTML = '<div class="empty">読み込み中…</div>';

  // ②-0 品目1行の tanka_items(段1・2026-09-13)。**段0が入るまでは null → 従来の②へ素通り**
  const tR = Date.now();
  try{
    const rows = await fetchRowsFromDb_();
    if(rows){
      saveCache(rows); applyData(rows);
      noteRefresh(`⚡DB行 ${((Date.now()-tR)/1000).toFixed(1)}s (${rows.items.length}品目・即時反映)`);
      return;   // ⚠行が正本=GAS追いかけはしない(古い price_master で上書きしてはいけない)
    }
  }catch(e){
    console.warn('[tanka] 行直読みを見送り→従来経路へ:', (e && e.message) || e);
  }

  // ② Supabaseを直読み(実測0.2〜0.9秒)
  const t0 = Date.now();
  try{
    const doc = await fetchFromDb_();
    saveCache(doc); applyData(doc);
    noteRefresh(`⚡DB ${((Date.now()-t0)/1000).toFixed(1)}s`);
    if(hasGas) chaseGasInBackground_(url, token);   // ③ 当日の📱共有ぶんを裏で追いかける(表示は待たせない)
    return;
  }catch(e){
    console.warn('[tanka] DB不通→現行GASへ:', (e && e.message) || e);
  }
  if(!hasGas){   // DBが駄目で接続設定も無い=ここで初めて⚙を出す(従来は無条件に出していた)
    if(!showedCache) openSettings();
    else noteRefresh('⚠ 最新の取得に失敗(表示は前回の内容)');
    return;
  }

  // ④ DBが駄目なら現行GAS(従来どおりの3回リトライ)
  try{
    const fresh = await fetchFromGas_(url, token, att => {

// ✏ 単価の編集(段3・2026-09-21) — 山田「単価変更とか編集できるようにできる?」
//   ★3役(admin/jimu/genba)すべて編集可(山田判断 2026-09-13)。対で2つ入れる:
//     ①履歴からの「戻す」… 誰でも直せる=誰でも間違えられる。気づいた人がその場で戻せることが効く
//     ②桁違いの警告      … 止めない。**確認を1枚挟むだけ**(正当な改定があるため)
//   🔴送り方の約束(migration046):
//     ・p_doc は**日本語キーの部分doc**(変えたキーだけ)
//     ・キー単位のマージ。**null=そのキーを消す(空欄に戻す)** / **0は「0という値」**
//     ・行が無い時は作らない(新規は tanka_add_item)
//     ・金額が整数でないと**例外**(黙って丸めない)
//   ⚠ここで0を落とすと「0円で出す運用の単価」が消える(処分系は実際に¥0で請求している)
// ============================================================================
const ED_FIX = [
  { key:'入居者単価', sec:'客出し' }, { key:'家主単価', sec:'客出し' }, { key:'材料費', sec:'材料' },
];
let ED = null;   // {item_no, version, doc, before}

function edLoggedIn_(){
  try{ const o = JSON.parse(localStorage.getItem('bc_sb_session')||'null'); return !!(o && o.access_token); }catch(_){ return false; }
}
function edToken_(){
  try{ const o = JSON.parse(localStorage.getItem('bc_sb_session')||'null'); return (o && o.access_token) || ''; }catch(_){ return ''; }
}
// 誰が直したかは**JWTから**刻む(自己申告にしない)
function edActor_(){
  try{
    const t = edToken_(); if(!t) return '';
    const p = JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
    return (p.user_metadata && (p.user_metadata.name || p.user_metadata.full_name)) || p.email || p.sub || '';
  }catch(_){ return ''; }
}
function edCanEdit_(){ return !!(DATA && DATA._rows && edLoggedIn_()); }
// 8〜64文字の英数と _- (tanka_guard_ の仕様)
function edOpId_(){ return 'tk' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }
// 全角・カンマ・空白を吸収して数にする。空欄は null(=キーを消す)
function edNum_(s){
  const t = String(s==null?'':s).normalize('NFKC').replace(/[,\s]/g,'').trim();
  if(t === '') return null;
  if(!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}
function edMoneyKeys_(){
  return (DATA.motoCols||[]).concat(['入居者単価','家主単価','材料費']).concat(DATA.hatchuCols||[]);
}

    const r = await fetch(SB_ROWS.base + 'tanka_items?select=item_no,doc,version,cat,item,unit&item_no=eq.' + encodeURIComponent(item_no), { headers: hdr });

function edRender_(){

  const row = (key, cls) => {

  };
  let h = '<div class="ednote">空欄にすると<b>その欄を消します</b>（未設定に戻る）。<b>0 は「0円」として残ります</b>。<br>'
        + '金額は<b>整数</b>のみ。小数を入れると保存できません。</div>';
  h += '<div class="edsec">基本</div>' + ['カテゴリー','項目','単位'].map(k=>row(k,'txt')).join('');

  h += '<div class="edsec">🧱 材料費</div>' + row('材料費');

  document.querySelectorAll('#ed-body input').forEach(inp => {
    inp.addEventListener('input', () => {
      // ⚠色の付き方は**実際に送るかどうか**と揃える。
      //   「２８，６００」のように見た目だけ違う入力で色が付くと、
      //   保存しても何も起きず「変えたのに保存されない」に見える。
      const k = inp.dataset.k, was = ED.before[k];
      const wasN = (was === undefined) ? null : was;
      const raw = inp.value.trim();
      let val;
      if(inp.classList.contains('txt')){ val = raw === '' ? null : raw; }
      else { const n = edNum_(raw); val = Number.isNaN(n) ? '__bad__' : n; }
      inp.classList.toggle('ch', JSON.stringify(val) !== JSON.stringify(wasN));
    });

}
// 変えたキーだけ集める。空欄→null(消す) / 数字→数(0も値)
function edDiff_(){
  const out = {}, bad = [];
  document.querySelectorAll('#ed-body input').forEach(inp => {
    const k = inp.dataset.k, was = ED.before[k];
    const isTxt = inp.classList.contains('txt');
    const raw = inp.value.trim();
    let val;
    if(isTxt){ val = raw === '' ? null : raw; }
    else {
      const n = edNum_(raw);
      if(Number.isNaN(n)){ bad.push(k + ' に数字でないものが入っています「' + raw + '」'); return; }
      if(n !== null && !Number.isInteger(n)){ bad.push(k + ' は整数にしてください（' + n + '）'); return; }
      val = n;
    }
    const wasN = (was === undefined) ? null : was;
    if(JSON.stringify(val) !== JSON.stringify(wasN)) out[k] = val;
  });
  return { doc: out, bad };
}
// 🔴桁違いの警告 — **止めない。確認を1枚挟むだけ**
//   ・非0 → 0     金額が消える向き(7/3に3品目が0にされた事故がこれ)
//   ・0 → 非0     警告しない(都度見積に値を入れる正常な操作)
//   ・5倍以上 / 5分の1以下 / マイナス
function edWarn_(diff){
  const money = new Set(edMoneyKeys_());
  const w = [];
  for(const k of Object.keys(diff)){
    if(!money.has(k)) continue;
    const a = ED.before[k], b = diff[k];
    const an = (typeof a === 'number') ? a : null;
    const bn = (typeof b === 'number') ? b : null;
    if(bn !== null && bn < 0){ w.push(k + ' がマイナスです（' + bn + '）'); continue; }
    if(an !== null && an !== 0 && bn === 0){ w.push(k + ' を ' + an.toLocaleString() + ' → 0円 にします（金額が消えます）'); continue; }
    if(an !== null && an > 0 && bn !== null && bn > 0){
      if(bn >= an * 5) w.push(k + ' を ' + an.toLocaleString() + ' → ' + bn.toLocaleString() + ' にします（5倍以上）');
      else if(bn * 5 <= an) w.push(k + ' を ' + an.toLocaleString() + ' → ' + bn.toLocaleString() + ' にします（5分の1以下）');
    }
    if(an !== null && an !== 0 && bn === null) w.push(k + ' の ' + an.toLocaleString() + ' を空欄に戻します（未設定になります）');
  }
  return w;
}
function edErr_(msg){ document.getElementById('ed-body').insertAdjacentHTML('afterbegin', '<div class="ederr">'+esc(msg)+'</div>'); }

async function edSave_(){
  const btn = document.getElementById('ed-save');
  const { doc, bad } = edDiff_();
  if(bad.length){ edErr_('保存できません:\n・' + bad.join('\n・')); return; }
  const keys = Object.keys(doc);
  if(!keys.length){ edErr_('変えたところがありません'); return; }
  const w = edWarn_(doc);
  if(w.length && !confirm('次の変更をします。よろしいですか？\n\n・' + w.join('\n・') + '\n\n（合計 ' + keys.length + '項目）')) return;
  btn.disabled = true; btn.textContent = '保存中…';
  try{
    const hdr = { apikey: SB.key, Authorization: 'Bearer ' + edToken_(), 'Content-Type':'application/json', Accept:'application/json' };
    const r = await fetch(SB_ROWS.base + 'rpc/tanka_set_item', { method:'POST', headers: hdr,
      body: JSON.stringify({ p_op_id: edOpId_(), p_item_no: ED.item_no, p_doc: doc, p_version: ED.version, p_actor: edActor_() }) });
    const txt = await r.text();
    if(!r.ok){
      // 整数チェックなどは**例外**で返る。黙って握りつぶさない
      let m = txt; try{ const j = JSON.parse(txt); m = j.message || j.hint || txt; }catch(_){}
      throw new Error('保存できませんでした:\n' + m);
    }
    let res = txt; try{ res = JSON.parse(txt); }catch(_){}
    const s = String(res);
    if(s === 'applied' || s === 'already_processed'){
      document.getElementById('edit').classList.remove('open');
      await load();                                  // 一覧を取り直す
      noteRefresh('✏ No.' + ED.item_no + ' を ' + keys.length + '項目 直しました');
      return;
    }
    if(s === 'stale_version'){ throw new Error('他の人が先に直しました。\n最新を読み直すので、もう一度確認してください。'); }
    if(s === 'not_loaded'){ throw new Error('この品目はまだDBに中身が入っていません（not_loaded）。\n台帳DB側の流し込みが済んでいない可能性があります。'); }
    if(s === 'item_no_mismatch'){ throw new Error('品目番号が食い違っています（item_no_mismatch）。\n画面を開き直してください。'); }
    if(s === 'no_such_item'){ throw new Error('この品目が見つかりません（no_such_item）。\n他の人が消したのかもしれません。'); }
    if(s === 'forbidden'){ throw new Error('編集の権限がありません（forbidden）。'); }
    throw new Error('知らない答えが返りました: ' + s);
  }catch(e){
    edErr_(e.message);
    if(/stale_version|他の人が先に/.test(e.message)) edOpen_(ED.item_no);   // 最新を読み直す
  }finally{ btn.disabled = false; btn.textContent = '保存'; }
}

async function edRestore_(hrow){
  if(!hrow) return;
  const old = (hrow.doc && hrow.doc.doc) || {};
  // いまの doc に対する差分を作る(消えたキーは null で消す)
  const diff = {};
  for(const k of new Set(Object.keys(old).concat(Object.keys(ED.doc)))){
    const a = ED.doc[k], b = old[k];
    if(JSON.stringify(a) !== JSON.stringify(b)) diff[k] = (b === undefined) ? null : b;
  }
  const keys = Object.keys(diff);
  if(!keys.length){ edErr_('いまの中身と同じです（戻す必要がありません）'); return; }
  if(!confirm('版' + hrow.version + ' の中身に戻します。\n' + keys.length + '項目が変わります。よろしいですか？')) return;
  try{
    const hdr = { apikey: SB.key, Authorization: 'Bearer ' + edToken_(), 'Content-Type':'application/json', Accept:'application/json' };
    const r = await fetch(SB_ROWS.base + 'rpc/tanka_set_item', { method:'POST', headers: hdr,
      body: JSON.stringify({ p_op_id: edOpId_(), p_item_no: ED.item_no, p_doc: diff, p_version: ED.version, p_actor: edActor_() + '(版'+hrow.version+'へ戻す)' }) });
    const txt = await r.text();
    if(!r.ok){ let m=txt; try{ const j=JSON.parse(txt); m=j.message||txt; }catch(_){} throw new Error('戻せませんでした:\n'+m); }
    let res = txt; try{ res = JSON.parse(txt); }catch(_){}
    if(String(res) === 'applied' || String(res) === 'already_processed'){
      document.getElementById('edit').classList.remove('open');
      await load();
      noteRefresh('📜 No.' + ED.item_no + ' を 版' + hrow.version + ' に戻しました');
      return;
    }
    throw new Error('戻せませんでした: ' + res);
  }catch(e){ edErr_(e.message); }
}

document.getElementById('ed-cancel').onclick = () => document.getElementById('edit').classList.remove('open');
document.getElementById('ed-save').onclick = edSave_;
document.getElementById('ed-hist').onclick = edHist_;
document.getElementById('edit').addEventListener('click', e => { if(e.target.id === 'edit') document.getElementById('edit').classList.remove('open'); });

$('#search').addEventListener('input', render);
$('#btn-reload').onclick = load;
// 起動
load();
</script>
</body>
