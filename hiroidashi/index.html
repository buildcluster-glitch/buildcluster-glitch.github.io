<!doctype html>
<html lang="ja">
<head>

<title>現場の拾い出し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&text=0123456789.%E3%8E%A1m%E5%A3%81%E5%A4%A9%E3%82%A2%E5%B7%BE&display=swap">
<style>
/* 紙の拾い出しシートをスマホへ。黒い帯・灰色の見出しは紙と同じ。選ぶと赤ペンの丸、下書きに入ると青い✓ */
:root{
  --paper:#eef1f3; --sheet:#ffffff; --ink:#1d2226; --ink2:#47515a; --muted:#6b7680; --line:#c9d0d6;
  --band:#3a4046; --band-ink:#ffffff; --grey:#dde2e6; --pen:#c7281e; --check:#1a6fd6; --warnbg:#fff4d6; --warnink:#6d4a00; --okbg:#e3f3ea; --okink:#14573a; --ngbg:#fde7e4; --ngink:#8a1d14;
  --s-tap:#1a5fb4; --s-num:#0e9474; --s-auto:#7a5fc0; --s-search:#e5a50a; --s-free:#c7362c;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif; --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14171a; --sheet:#1c2024; --ink:#e9ecee; --ink2:#bcc5cc; --muted:#94a0a9; --line:#3a4249;
  --band:#2c3238; --band-ink:#f1f3f4; --grey:#2a3036; --pen:#ff7468; --check:#6aaeff; --warnbg:#3a2f12; --warnink:#f4d98f; --okbg:#143225; --okink:#9fe0bf; --ngbg:#3d1c19; --ngink:#ffb4ab;
  --s-tap:#3f86dc; --s-num:#0f9a78; --s-auto:#b26adf; --s-search:#b98407; --s-free:#b8352c; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* iPhoneで勝手に拡大しないため */
:focus-visible{outline:3px solid var(--check);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--check)}
.wrap{max-width:1120px;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.stage{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}.only-wide{display:none!important}}
@media (min-width:881px){.only-narrow{display:none!important}}
.tool,.draft,.box{background:var(--sheet);border:1.5px solid var(--ink);min-width:0}
.head{padding:8px 12px;display:grid;gap:4px;border-bottom:1.5px solid var(--ink)}
.head h1{font-size:17px;margin:0;line-height:1.35}
.sub{font-size:13px;color:var(--ink2)}
.toprow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--grey);white-space:nowrap}
.status.ok{background:var(--okbg);color:var(--okink)}.status.ng{background:var(--ngbg);color:var(--ngink)}.status.wait{background:var(--warnbg);color:var(--warnink)}
.warn{background:var(--warnbg);color:var(--warnink);padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.warn.ng{background:var(--ngbg);color:var(--ngink)}
.warn.ok{background:var(--okbg);color:var(--okink)}
details>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line)}
details .inner{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.plan-img{max-width:100%;max-height:60vh;display:block;margin:0 auto;background:#fff}
.tabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band)}
.tabs button{flex:1 1 0;background:none;border:0;color:var(--band-ink);min-height:46px;font-size:14px;font-weight:700;cursor:pointer;position:relative;padding:4px 2px}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12%;right:12%;bottom:5px;height:3px;background:var(--band-ink);border-radius:2px}
.band{background:var(--grey);text-align:center;font-weight:700;font-size:14px;padding:6px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.row{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px;min-width:0}
.lbl{font-size:13px;color:var(--ink2);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.optw{display:inline-flex;align-items:center;gap:4px}
.opt{min-height:44px;min-width:44px;padding:4px 13px;background:transparent;border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.opt.on{border:2.5px solid var(--pen);border-radius:48% 52% 45% 55%/62% 44% 56% 38%;font-weight:700;padding:3px 15px}
.st{display:inline-flex;align-items:center;gap:2px}
.st button{width:38px;height:38px;border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;font-size:18px;line-height:1;cursor:pointer}
.st b{font-family:var(--hand);color:var(--pen);font-size:21px;min-width:26px;text-align:center}
.room{border-bottom:1px solid var(--line)}
.room>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:6px 12px;background:none;border:0;cursor:pointer;text-align:left}
.room>button b{font-size:15px}
.room>button span{font-size:13px;font-family:var(--hand);color:var(--pen);text-align:right}
.rbody{padding:4px 12px 12px;display:grid;gap:8px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nf{display:grid;gap:3px;font-size:12px;color:var(--ink2);min-width:0;align-content:start}
.nf input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);text-align:center;font-family:var(--hand);font-size:23px;color:var(--pen);padding:0 4px}
.hint{border:1px dashed var(--line);background:none;border-radius:8px;padding:4px 6px;font-size:12px;min-height:34px;cursor:pointer;color:var(--ink2)}
.txt{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);padding:6px 10px}
.res{display:grid}
.res button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);min-height:44px;padding:6px 2px;cursor:pointer}
.res button span:last-child{white-space:nowrap;color:var(--ink2);font-size:13px}
.free{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 84px;gap:6px}
.free input{height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);padding:0 8px;min-width:0;width:100%}
.btn{min-height:44px;padding:6px 14px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.btn.pri{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.btn.small{min-height:36px;padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.foot{position:sticky;bottom:0;background:var(--band);color:var(--band-ink);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:4}
.foot .sum{font-size:13px;line-height:1.35}
.foot .sum b{font-size:17px}
.foot .btn{border-color:var(--band-ink);background:var(--band-ink);color:var(--band)}
.draft{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 16px);overflow:auto}
@media (max-width:880px){.draft{position:static;max-height:none;border:0;border-top:1.5px solid var(--ink)}}
.dhead{background:var(--band);color:var(--band-ink);padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tally{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.s-tap{background:var(--s-tap)}.s-num{background:var(--s-num)}.s-auto{background:var(--s-auto)}.s-search{background:var(--s-search)}.s-free{background:var(--s-free)}
.ln{border-bottom:1px solid var(--line)}
.ln>button{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 8px;align-items:start;background:none;border:0;text-align:left;padding:8px 12px;cursor:pointer}
.ck{color:var(--check);font-weight:700;font-size:16px;line-height:1.3}
.nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.sp{font-size:12px;color:var(--ink2);display:block;font-weight:400}
.am{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.am small{display:block;color:var(--muted);font-size:12px}
.no-amount .am,.no-amount .amt{visibility:hidden}
.tenant,.flag{font-size:11px;border:1px solid var(--pen);color:var(--pen);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:700;white-space:nowrap}
.flag{border-color:var(--warnink);color:var(--warnink)}
.edit{padding:0 12px 10px 42px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit input{width:96px;height:42px;border:1.5px solid var(--line);border-radius:8px;background:var(--sheet);padding:0 8px;font-variant-numeric:tabular-nums}
.edit label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.total{display:flex;justify-content:space-between;padding:10px 12px;font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--muted)}
.list{display:grid}
.card{display:grid;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.card b{font-size:15px}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--grey);margin-left:6px;white-space:nowrap}
.pill.todo{background:var(--warnbg);color:var(--warnink)}.pill.done{background:var(--okbg);color:var(--okink)}.pill.again{background:var(--ngbg);color:var(--ngink)}
.tick{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px 8px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:start}
.tick input{width:22px;height:22px;margin:2px 0 0}
.tick.on .nm{color:var(--muted)}
#login{position:fixed;inset:0;background:var(--paper);z-index:30;display:grid;place-items:center;padding:16px}
#login form{background:var(--sheet);border:1.5px solid var(--ink);padding:16px;max-width:360px;width:100%;display:grid;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-ink);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="note">読み込み中です…</p></div>
<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <b>現場の拾い出し</b>
    <p class="note" id="loginMsg" style="margin:0">カレンダーと同じメールアドレスとパスワードです</p>
    <input id="lgEmail" class="txt" type="email" autocomplete="username" placeholder="メールアドレス" required>
    <input id="lgPass" class="txt" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <div id="lgErr" class="note" style="color:var(--pen)"></div>
    <button class="btn pri" type="submit" id="lgBtn">ログイン</button>
  </form>
</div>
<div id="toast" role="status" hidden></div>
<script src="sheet.js?v=1"></script>
<script>
'use strict';
// ---- 設定 ------------------------------------------------------------------------------------
const DB = { url: 'https://grbqpsunbuduvvgdntzc.supabase.co', key: 'sb_publishable__CEhKynIR-v9uGW_cBg_1g_wHyN-k8n' };   // 公開前提のキー(カレンダー・単価表と同じ)
const SB_LS = 'bc_sb_session';   // ログインはカレンダーと同じ入れ物(同じサイト=どれかでログインしていれば通る)
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo') === '1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const yen = (n) => '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP');
const norm = (s) => String(s || '').normalize('NFKC').replace(/[\s　・\-‐ー―]/g, '').toLowerCase();
const rid = (p, n) => p + Date.now().toString(36) + Array.from(crypto.getRandomValues(new Uint8Array(n || 5)), (b) => (b % 36).toString(36)).join('');
const when = (t) => { if (!t) return ''; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }

// ---- スマホ内の保存(IndexedDB)。localStorage はカレンダーと同じ5MB枠なので使わない ---------------
const store = (() => {
  let dbp = null;
  const mem = new Map();
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open('hd_store', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (_) { res(null); }
  }));
  const tx = async (mode, fn) => {
    const db = await open(); if (!db) return undefined;
    return new Promise((res) => {
      try {
        const t = db.transaction('kv', mode), s = t.objectStore('kv'); const q = fn(s);
        t.oncomplete = () => res(q && q.result); t.onerror = () => res(undefined); t.onabort = () => res(undefined);
      } catch (_) { res(undefined); }
    });
  };
  return {
    async get(k) { const v = await tx('readonly', (s) => s.get(k)); return v === undefined ? mem.get(k) : v; },
    async set(k, v) { mem.set(k, v); await tx('readwrite', (s) => s.put(v, k)); },
    async del(k) { mem.delete(k); await tx('readwrite', (s) => s.delete(k)); },
    async keys() { const v = await tx('readonly', (s) => s.getAllKeys()); return v || [...mem.keys()]; },
  };
})();

// ---- ログインと通信(確認ページ・単価表と同じ作法) ---------------------------------------------
function session() { try { const o = JSON.parse(localStorage.getItem(SB_LS) || 'null'); return (o && o.access_token) ? o : null; } catch (_) { return null; } }
async function authFetch(path, body) {
  const r = await fetch(DB.url + '/auth/v1/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: DB.key, Authorization: 'Bearer ' + DB.key }, body: JSON.stringify(body || {}) });
  let d = null; try { d = await r.json(); } catch (_) {}
  if (!r.ok) { const e = new Error((d && (d.error_description || d.msg || d.error || d.message)) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return d;
}
function storeToken(d) {
  if (!d || !d.access_token) throw new Error('応答にトークンがありません');
  const s = { access_token: d.access_token, refresh_token: d.refresh_token || '', expires_at: d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600)), email: (d.user && d.user.email) || '', role: (d.user && d.user.app_metadata && d.user.app_metadata.bc_role) || '' };
  try { localStorage.setItem(SB_LS, JSON.stringify(s)); } catch (_) {}
  return s;
}
const locked = (fn) => (navigator.locks && navigator.locks.request) ? navigator.locks.request('bc_sb_refresh', fn) : fn();
// 🔴 bc_sb_session はカレンダーと共有。このページから消すとカレンダーごとログアウトになるので、失敗しても消さない。
//    延長の直前に読み直す(別の画面が延長済みならそれを使う)。だめな時はログイン欄を出すだけ(手本=カレンダー sbRefresh_)。
async function refresh(s) {
  try { return storeToken(await authFetch('token?grant_type=refresh_token', { refresh_token: s.refresh_token })); }
  catch (e) {
    const now = session(); if (now && now.access_token !== s.access_token) return now;
    if (e && (e.status === 400 || e.status === 401)) {
      await new Promise((r) => setTimeout(r, 1500));
      const again = session(); if (again && again.access_token !== s.access_token) return again;
      return null;
    }
    throw e;
  }
}
const ensureFresh = () => locked(async () => {
  let s = session(); if (!s || !s.expires_at) return s;
  if (s.expires_at * 1000 - Date.now() > 90000) return s;
  s = session(); if (!s || !s.refresh_token) return s;
  if (s.expires_at * 1000 - Date.now() > 90000) return s;
  try { return await refresh(s); } catch (_) { return s; }
});
const after401 = (used) => locked(async () => {
  const now = session(); if (now && now.access_token !== used) return now;
  if (!now || !now.refresh_token) return null;
  return await refresh(now);
});
function needLogin(msg) { showLogin(msg); const e = new Error('ログインが必要です'); e.login = true; return e; }
async function dbFetch(path, opts) {
  const s = await ensureFresh(); if (!s) throw needLogin('');
  const go = (tok) => fetch(DB.url + path, Object.assign({}, opts, { headers: Object.assign({ 'Content-Type': 'application/json' }, (opts && opts.headers) || {}, { apikey: DB.key, Authorization: 'Bearer ' + tok }) }));
  let r = await go(s.access_token);
  if (r.status === 401) {
    const s2 = await after401(s.access_token);
    if (!s2) throw needLogin('ログインが切れました。もう一度ログインしてください');
    r = await go(s2.access_token);
    if (r.status === 401) throw needLogin('ログインが切れました。もう一度ログインしてください');
  }
  return r;
}
async function dbJson(path, opts) {
  const r = await dbFetch(path, opts);
  if (!r.ok) { let m = ''; try { const d = await r.json(); m = d.message || d.code || ''; } catch (_) {} const e = new Error(m || ('HTTP ' + r.status)); e.status = r.status; e.server = true; throw e; }
  return r.json();
}
const rpc = (fn, args) => dbJson('/rest/v1/rpc/' + fn, { method: 'POST', body: JSON.stringify(args) });
const enc = encodeURIComponent;
const ANKEN_COLS = 'id,bukken,room,motouke,koji,status,total,created_at,priceCol:doc-%3Emeta-%3E%3EpriceCol,madori:doc-%3Emeta-%3Etaikyo-%3E%3Emadori,deleted:doc-%3E%3Edeleted';
const LIST_COLS = 'id,anken_id,bukken,room,koji,motouke,status,version,line_count,total,updated_at,updated_by,created_by,sent_at,sent_by,sent_version,entered_at,entered_by,entered_version';

const RealApi = {
  who() { const s = session(); return s ? { email: s.email, role: s.role } : null; },
  async items() {
    let rows;
    try { rows = await dbJson('/rest/v1/tanka_items?is_deleted=eq.false&select=item_no,cat,item,unit,prices,room:doc-%3E%3E' + enc('室名')); }
    catch (e) { if (!e.server) throw e; rows = await dbJson('/rest/v1/tanka_items?is_deleted=eq.false&select=item_no,cat,item,unit,prices'); }
    if (!rows.length) throw new Error('単価表が空です');
    return rows;
  },
  async anken(id) { const r = await dbJson(`/rest/v1/anken?id=eq.${enc(id)}&select=${ANKEN_COLS}`); return r[0] || null; },
  async candidates(room) { const x = String(room || '').replace(/号室$/, ''); return dbJson(`/rest/v1/anken?room=in.(${enc('"' + x + '"')},${enc('"' + x + '号室"')})&select=${ANKEN_COLS}&order=created_at.desc&limit=60`); },
  async bukkenNames() { return (await dbJson('/rest/v1/bukken?select=name&order=name')).map((x) => x.name); },
  async bukken(name) { const r = await dbJson(`/rest/v1/bukken?name=eq.${enc(name)}&select=name,type,loft,madori,accent,cf,notes,memo,images:doc-%3EmadoriImages,options:doc-%3EmadoriOptions,defaultMadori:doc-%3E%3EmadoriDefault`); return r[0] || null; },
  async draftByAnken(id) { const r = await dbJson(`/rest/v1/genba_hiroidashi?anken_id=eq.${enc(id)}&select=*`); return r[0] || null; },
  async draftByPlace(b, room) { const r = await dbJson(`/rest/v1/genba_hiroidashi?bukken=eq.${enc(b)}&room=eq.${enc(room)}&order=updated_at.desc&limit=1&select=*`); return r[0] || null; },
  async draft(id) { const r = await dbJson(`/rest/v1/genba_hiroidashi?id=eq.${enc(id)}&select=*`); return r[0] || null; },

  $('app').innerHTML = `<div class="toprow"><a href="${qs({})}">← 入口へ</a></div><h1 style="font-size:18px;margin:0">届いた下書き</h1>
  <div class="opts"><button class="opt ${LIST_FILTER === 'todo' ? 'on' : ''}" data-scope="list" data-act="filter" data-v="todo">未入力 ${rows.filter(isTodo).length}</button><button class="opt ${LIST_FILTER === 'all' ? 'on' : ''}" data-scope="list" data-act="filter" data-v="all">すべて ${rows.length}</button></div>
  <div class="box"><div class="list">${show.map((d) => `<a class="card" href="${qs({ id: d.id, read: '1' })}"><b>${esc(d.bukken)} ${esc(d.room)}${stateP(d)}</b><span class="note">${esc(d.sent_by || d.updated_by)} ${esc(when(d.sent_at))} ・ ${d.line_count}行 ・ ${yen(d.total)}${d.motouke ? ' ・ ' + esc(d.motouke) : ''}</span></a>`).join('') || '<div class="row note">ありません。</div>'}</div></div>`;
}
function listAct(el) { if (el.dataset.act === 'filter') { LIST_FILTER = el.dataset.v; renderSent(); } }

// 事務が見ながら打つ画面。行ごとの✓はこのブラウザだけに残す(紙の青い✓の代わり)
async function renderRead(id) {
  let row = null;
  try { row = await Api.draft(id); } catch (e) { if (e.login) return; }
  if (!row) { $('app').innerHTML = '<p class="note">下書きを読めませんでした。消されたか、電波がありません。</p>'; return; }
  document.title = `${row.bukken} ${row.room}`;
  const key = 'tick:' + id; const ticks = (await store.get(key)) || {};
  const L = (row.doc && row.doc.lines) || [];
  const draw = () => {
    const done = L.filter((l) => ticks[l.key]).length;
    $('app').innerHTML = `<div class="toprow"><a href="${qs({ view: 'sent' })}">← 届いた下書き</a><a href="${qs({ id })}">直す画面へ</a></div>
    <div class="box"><div class="head"><h1>${esc(row.bukken)} ${esc(row.room)}${stateP(row)}</h1><div class="sub">${esc(row.motouke || '')}${row.koji ? ' ・ ' + esc(row.koji) : ''}${row.doc.madori ? ' ・ ' + esc(row.doc.madori) : ''}${row.doc.ampere ? ' ・ ' + esc(row.doc.ampere) + 'A' : ''}${row.doc.loft ? ' ・ ロフト' : ''}${row.doc.stair ? ' ・ 内階段' : ''}</div>${timingText(row.doc.timing) ? `<div class="sub">現場の入力: ${esc(timingText(row.doc.timing))}</div>` : ''}<div class="sub">送った人: ${esc(row.sent_by || '')} ${esc(when(row.sent_at))} ・ 単価の列: ${esc(row.doc.priceCol || 'なし')}${row.anken_id ? ` ・ 見積 ${esc(row.anken_id)}` : ' ・ 見積とはまだつながっていません'}</div></div>
      <div class="tally">✓ ${done} / ${L.length}行</div>
      ${L.map((l) => `<label class="tick ${ticks[l.key] ? 'on' : ''}"><input type="checkbox" data-tick="${esc(l.key)}" ${ticks[l.key] ? 'checked' : ''}><span class="nm">${l.room ? esc(l.room) + ' ' : ''}${esc(l.name)}${l.burden === '入居者' ? '<span class="tenant">入居者</span>' : ''}${l.priceEdited ? '<span class="flag">現場で単価を変更</span>' : ''}${(l.noPrice || l.askPrice) ? '<span class="flag">単価を確認</span>' : ''}${l.specs ? `<span class="sp">${esc(l.specs)}</span>` : ''}</span><span class="am">${yen((Number(l.qty) || 0) * (Number(l.price) || 0))}<small>${esc(l.qty)}${esc(l.unit)} × ${yen(l.price)}</small></span></label>`).join('')}
      <div class="total"><span>合計(税別)</span><span>${yen(row.doc.total)}</span></div>
      ${row.doc.memo ? `<div class="row"><div class="lbl">メモ</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(row.doc.memo)}</div></div>` : ''}
      <div class="row" style="border:0"><div class="opts"><button class="btn pri" id="markBtn">${row.entered_at ? '入力済みを取り消す' : '見積に入れ終わった'}</button></div><p class="note" style="margin:0">⚠ まだ見積アプリへ自動では入りません。見ながら打ってください。</p></div>
    </div>`;
    $('app').querySelectorAll('[data-tick]').forEach((c) => c.addEventListener('change', () => { ticks[c.dataset.tick] = c.checked; store.set(key, ticks); draw(); }));
    $('markBtn').addEventListener('click', async () => {
      try { const res = await Api.mark({ op: rid('op', 6), id, done: !row.entered_at, editor: editorName() }); if (res.result === 'applied') { row = await Api.draft(id); draw(); toast('記録しました'); } }
      catch (e) { toast('記録できませんでした'); }
    });
  };
  draw();
}

// 別の部屋を開いても、前の部屋の未送信を送れるようにする(カレンダーの枠は部屋ごとに開き直すため)
const snapshotOf = (doc) => { const lines = HD.buildLines(doc, byNo(doc.priceCol)); return JSON.parse(JSON.stringify(Object.assign({}, doc, { lines, total: HD.totalOf(lines), savedFrom: 'page-v1' }))); };
async function flushOthers(currentId) {
  for (const d of await localDrafts()) {
    if (d.id === currentId || d.conflict || !(d.dirty || d.inflight)) continue;
    try {
      const job = d.inflight || { op: rid('op', 6), id: d.id, base: d.version || 0, anken: d.ankenId, bukken: d.bukken, room: d.room, koji: d.koji, motouke: d.motouke, doc: snapshotOf(normalizeDoc(d.doc)), send: !!d.sendAfter, seq: d.seq, editor: editorName() };
      d.inflight = job; await store.set('d:' + d.id, d);
      const res = await Api.save(job);
      d.inflight = null;
      if (res.result === 'applied') { d.version = res.version; if (job.send) { d.status = 'sent'; d.sentVersion = res.version; d.sentAt = new Date().toISOString(); d.sendAfter = false; } if (d.seq === job.seq) d.dirty = false; }
      else if (res.result === 'stale_version') d.conflict = { kind: 'stale', by: res.updated_by, at: res.updated_at, version: res.version };
      else if (res.result === 'exists' && res.id !== d.id) d.conflict = { kind: 'exists', id: res.id, version: res.version };
      else if (res.result === 'exists') { d.version = res.version; d.dirty = true; }
      else if (res.result === 'deleted' || res.result === 'not_found') d.conflict = { kind: 'deleted' };
      await store.set('d:' + d.id, d);
    } catch (e) {
      if (e && e.server) { d.inflight = null; await store.set('d:' + d.id, d); continue; }
      return;   // 電波なし・ログイン切れは次の機会に
    }
  }
}

// ---- 下書きを開く -----------------------------------------------------------------------------
const CLOSED = ['完了', '失注', 'キャンセル'];
const stripRoom = (r) => norm(String(r || '').replace(/号室$/, ''));
const sameRoom = (a, b) => stripRoom(a) === stripRoom(b);
const sameBukken = (a, b) => { const x = norm(a), y = norm(b); return !!x && !!y && (x === y || x.includes(y) || y.includes(x)); };
const isLiveAnken = (a) => a && String(a.deleted) !== 'true' && !CLOSED.includes(a.status);
// 前の入居者の部屋の下書きを開かないよう、古いものは続きにしない
const recentRow = (d) => { const age = Date.now() - new Date(d.updated_at).getTime(); return age < 60 * 864e5 && !(d.entered_at && age > 7 * 864e5); };
const recentLocal = (d) => !!(d.dirty || d.inflight) || (Date.now() - (d.savedAt || 0)) < 60 * 864e5;

function linkHtml() {
  if (!R) return '';
  const note = R.ankenNote ? `<div class="warn"><div>⚠ ${esc(R.ankenNote)}</div></div>` : '';
  const c = (R.candidates || []);
  const label = (a) => `${esc(a.status)} ・ ${esc(when(a.created_at))} 作成 ・ ${yen(a.total)}${a.koji ? ' ・ ' + esc(a.koji) : ''}`;
  const btns = (list) => list.map((a) => `<button class="btn small" data-act="link" data-v="${esc(a.id)}">${label(a)}</button>`).join('');
  if (R.ankenId) {
    const me = c.find((a) => a.id === R.ankenId) || R.ankenInfo;
    const others = c.filter((a) => a.id !== R.ankenId);
    return note + `<details><summary>見積: ${me ? label(me) : esc(R.ankenId)}</summary><div class="inner" style="white-space:normal"><div class="note">この下書きをつないでいる見積です。${esc(R.ankenId)}</div>${others.length ? `<div class="note">同じ部屋のほかの見積:</div><div class="opts">${btns(others)}</div>` : ''}</div></details>`;
  }
  if (c.length) return note + `<div class="warn"><div><b>この部屋の見積を選んでください。</b> 前の入居者の見積と間違えないよう、自動ではつなぎません。まだなければ、このまま入力できます。</div><div class="opts">${btns(c)}</div></div>`;
  return note + (R.candidates ? `<div class="warn"><div>この部屋の開いている見積はありません。下書きだけ保存します。</div></div>` : '');
}
function renderLink() { const el = $('link'); if (el) el.innerHTML = linkHtml(); }
async function loadCandidates() {
  try {
    const rows = await Api.candidates(R.room);
    R.candidates = rows.filter((a) => isLiveAnken(a) && sameBukken(a.bukken, R.bukken) && sameRoom(a.room, R.room) && !/^修繕/.test(a.koji || ''));
  } catch (e) { R.candidates = null; }
  renderLink();
}
function applyAnken(a) {
  R.ankenId = a.id; R.ankenInfo = a;
  if (a.motouke) R.motouke = a.motouke;
  if (a.koji) R.koji = a.koji;
  if (!R.doc.priceCol) R.doc.priceCol = colFor(R.motouke, a.priceCol);
  if (!R.doc.madori && a.madori) { R.doc.madori = a.madori; if (!R.doc.rooms.some((r) => roomSum(r))) R.doc.rooms = HD.defaultRooms(a.madori).map(HD.blankRoom); }
}
async function openEditor(p) {
  let row = null, ank = null, info = null, netOk = true, ankenNote = '';
  let ankenId = p.anken || null;
  try {
    if (ankenId) {
      ank = await Api.anken(ankenId);
      // 渡された見積が本当にこの部屋のものか照らし合わせる(1部屋に複数パターンがある・前の入居者の案件もある)
      if (!ank || String(ank.deleted) === 'true') ankenNote = '渡された見積が見つからないので、つなぎませんでした。';
      else if ((p.bukken && !sameBukken(ank.bukken, p.bukken)) || (p.room && !sameRoom(ank.room, p.room))) ankenNote = `渡された見積は「${ank.bukken} ${ank.room}」のものだったので、つなぎませんでした。`;
      else if (CLOSED.includes(ank.status)) ankenNote = `渡された見積は「${ank.status}」なので、つなぎませんでした。`;
      if (ankenNote) { if (ank && !p.bukken) { p.bukken = ank.bukken; p.room = ank.room; } ank = null; ankenId = null; }
    }
    if (ankenId) row = await Api.draftByAnken(ankenId);
    else if (p.id) row = await Api.draft(p.id);
    const place = (ank && ank.bukken) || p.bukken;
    if (!row && place) { const d = await Api.draftByPlace(place, (ank && ank.room) || p.room || ''); if (d && recentRow(d) && (!ankenId || !d.anken_id)) row = d; }
  } catch (e) { if (e.login) return; if (e.status !== 404) netOk = false; }
  // 電波がなくて照らし合わせられなかった見積は、つながない(開き直した時に選べる)
  if (!netOk && ankenId && !ank) { ankenId = null; }
  const all = await localDrafts();
  const place = (ank && ank.bukken) || p.bukken || '';
  const placeRoom = (ank && ank.room) || p.room || '';
  const local = all.find((d) => p.id && d.id === p.id) || (ankenId && all.find((d) => d.ankenId === ankenId)) || all.find((d) => !p.id && place && sameBukken(d.bukken, place) && sameRoom(d.room, placeRoom) && recentLocal(d) && (!ankenId || !d.ankenId)) || null;
  const bukken = (row && row.bukken) || (local && local.bukken) || place;
  const room = (row && row.room) || (local && local.room) || placeRoom;
  if (!bukken) { $('app').innerHTML = '<p class="note">開く部屋が分かりません。<a href="?">入口へ戻る</a></p>'; return; }

  if (local && local.inflight) R = local;                                                                   // 答えが返らなかった送信は、まず送り直して答えを聞く
  else if (local && local.dirty && (!row || (row.id === local.id && row.version === local.version))) R = local;   // 未送信の入力を優先
  else if (local && local.dirty && row && row.id === local.id) { R = local; R.conflict = { kind: 'stale', by: row.updated_by, at: row.updated_at, version: row.version }; }
  else if (row) R = fromRow(row);
  else if (local) R = local;
  else {
    const madori = (ank && ank.madori) || p.madori || '';
    R = { id: rid('hd', 5), version: 0, ankenId: null, bukken, room, koji: (ank && ank.koji) || p.koji || '原状回復工事', motouke: (ank && ank.motouke) || p.motouke || '', status: 'draft', doc: newDoc(madori), dirty: false, seq: 0, inflight: null, conflict: null };
    R.isNew = true;
    R.doc.timing = { openedAt: new Date().toISOString() };
  }
  R.doc = normalizeDoc(R.doc);
  R.ankenNote = ankenNote; R.candidates = undefined;
  if (ank) { const wasLinked = R.ankenId; applyAnken(ank); if (!wasLinked && R.version) changed(); }
  if (!R.doc.priceCol) R.doc.priceCol = colFor(R.motouke, ank && ank.priceCol);
  document.title = `${bukken} ${room}`;
  try {
    const names = await Api.bukkenNames(); store.set('bukkenNames', names);
    const hit = names.find((n) => n === bukken) || names.find((n) => norm(n) === norm(bukken)) || names.find((n) => sameBukken(n, bukken));
    if (hit) info = await Api.bukken(hit);
    if (info) store.set('bk:' + norm(bukken), info);
  } catch (e) { if (e.login) return; info = await store.get('bk:' + norm(bukken)); }
  R.info = info;
  if (info && R.isNew) {
    if (!R.doc.madori) {
      const o = Array.isArray(info.options) ? info.options : [];
      const m = info.defaultMadori || (o.length === 1 ? o[0] : '');
      if (m) { R.doc.madori = m; R.doc.rooms = HD.defaultRooms(m).map(HD.blankRoom); }
    }
    const lf = String(info.loft || '');
    if (/内階段/.test(lf)) R.doc.stair = !/2Fのみ/.test(lf);
    else if (/〇|○/.test(lf) && !/2Fのみ/.test(lf)) R.doc.loft = true;
    if (/ロフト/.test(R.doc.madori)) R.doc.loft = true;
  }
  renderEditor();
  if (R.inflight || R.dirty) pushNow(false);
  loadCandidates();
  flushOthers(R.id).catch(() => {});
  if (info && Array.isArray(info.images) && info.images.length) {
    try {
      const sorted = [...info.images].sort((a, b) => (String(b.label) === String(room) ? 1 : 0) - (String(a.label) === String(room) ? 1 : 0));
      const refs = sorted.slice(0, 2).map((m) => m.driveId).filter(Boolean);
      R.info = Object.assign({}, info, { images: sorted.slice(0, 2) });
      R.planUrls = await Api.planUrls(refs);
      const el = $('info'); if (el) el.innerHTML = infoHtml();
    } catch (_) {}
  }
}

// ---- ログイン画面 ------------------------------------------------------------------------------
function showLogin(msg) { $('loginMsg').textContent = msg || 'カレンダーと同じメールアドレスとパスワードです'; $('lgErr').textContent = ''; $('login').hidden = false; }
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const btn = $('lgBtn'); btn.disabled = true; $('lgErr').textContent = '';
  try { storeToken(await authFetch('token?grant_type=password', { email: $('lgEmail').value.trim(), password: $('lgPass').value })); $('lgPass').value = ''; $('login').hidden = true; boot(); }
  catch (err) { $('lgErr').textContent = err && err.status === 400 ? 'メールアドレスかパスワードが違います' : '通信できませんでした'; }
  btn.disabled = false;
});

// ---- 起動 --------------------------------------------------------------------------------------
async function boot() {
  try {
    if (DEMO) {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'demo.js'; s.onload = res; s.onerror = () => rej(new Error('見本のデータがありません')); document.head.appendChild(s); });
      Api = window.HD_DEMO_API;
    } else if (!session()) { showLogin(''); return; }
    purgeOld().catch(() => {});
    await loadCatalog();
    const view = Q.get('view');
    if (view === 'sent') return renderSent();
    if (Q.get('read') === '1' && Q.get('id')) return renderRead(Q.get('id'));
    const p = { anken: Q.get('anken'), id: Q.get('id'), bukken: Q.get('bukken'), room: Q.get('room') || '', motouke: Q.get('motouke') || '', koji: Q.get('koji') || '', madori: Q.get('madori') || '' };
    if (p.anken || p.id || p.bukken) return openEditor(p);
    return renderHome();
  } catch (e) {
    if (e && e.login) return;
    $('app').innerHTML = `<p class="note">読み込めませんでした。電波を確認して、もう一度開いてください。</p><p class="note">${esc(e && e.message)}</p>`;
  }
}
boot();
</script>
